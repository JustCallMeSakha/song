<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Video | Sakha</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #0f0f0f;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.container {
  width: 90%;
  max-width: 800px;
  text-align: center;
}

h1 {
  margin-bottom: 15px;
  font-size: 24px;
}

video {
  width: 100%;
  border-radius: 12px;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
}

p {
  margin-top: 10px;
  opacity: 0.8;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">
  <h1>😮‍💨</h1>

  <video controls>
    <source src="https://files.catbox.moe/8sel4i.mp4" type="video/mp4">
    Browser kamu tidak mendukung video.
  </video>

  <p>© 2025 Sakha</p>
</div>

</body>
</html>
